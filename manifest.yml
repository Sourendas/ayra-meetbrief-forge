# MeetBrief (Ayra) — Codegeist 2026 Forge app
# Category: Software Teams
# Bonus claimed: Rovo agent + actions
# Teamwork Graph scopes stay commented out (restricted allowlist). Do not re-enable
# unless a deploy with those scopes succeeds.
#
# app.id is the id from `forge register`. Do not replace it.

modules:
  jira:issuePanel:
    - key: meetbrief-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: MeetBrief
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      viewportSize: large

  confluence:globalPage:
    - key: meetbrief-confluence-page
      resource: main
      resolver:
        function: resolver
      render: native
      title: MeetBrief
      route: meetbrief

  rovo:agent:
    - key: meetbrief-agent
      name: MeetBrief
      description: Pre-meeting briefing agent that gathers Jira + Confluence context
        into a sourced one-pager.
      prompt: |
        You are MeetBrief, a pre-meeting briefing agent for software teams.

        Your job is to help users walk into meetings prepared with a short, sourced brief —
        not a blank page. Prefer Atlassian workspace context (Jira work items, Confluence pages)
        over inventing external news.

        You can help with:
        A. Building a pre-meeting brief from a Jira issue key or summary
        B. Pulling related Confluence pages for agenda / background
        C. Framing discussion points and open questions for a role (supplier, investor, partner, influencer, or teammate)
        D. Flagging gaps: what is missing, unverified, or out of date

        Rules:
        - Never invent URLs, dates, statuses, comments, or page titles.
        - If an action returns status "partial" or "error", quote its message and continue with what you actually received.
        - Separate workspace facts from the seat template. The template is not a fact.
        - Keep the brief scannable: Snapshot, Recent, Discussion, Open questions, Sources.
        - Use gather-issue-context when the user names a Jira issue key (PROJ-123) or has an issue open.
        - Use gather-page-context when the user names a Confluence topic, page, or space.
        - Use assemble-brief to format the one-pager. Pass contextJson as the JSON from the gather actions. If gather failed, still assemble and say the brief is a template.
      conversationStarters:
        - Brief me on this issue before the stakeholder sync
        - What Confluence pages should I read before this sync?
        - Draft discussion points for a teammate check-in on PROJ-123
      actions:
        - gather-issue-context
        - gather-page-context
        - assemble-brief

  action:
    - key: gather-issue-context
      name: Gather Jira issue context
      function: gatherIssueContext
      actionVerb: GET
      description: >
        Reads a Jira work item (summary, description, status, comments snippet,
        linked issues) and returns structured context for a pre-meeting brief.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: Jira issue key, for example PROJ-123.

    - key: gather-page-context
      name: Gather Confluence page context
      function: gatherPageContext
      actionVerb: GET
      description: >
        Searches or reads Confluence pages related to a topic and returns
        titles, excerpts, and links suitable for a meeting brief. Stub-friendly
        when CQL returns little.
      inputs:
        query:
          title: Search query
          type: string
          required: true
          description: Topic, meeting name, or page title keywords.
        spaceKey:
          title: Space key
          type: string
          required: false
          description: Optional Confluence space key to narrow search.

    - key: assemble-brief
      name: Assemble meeting brief
      function: assembleBrief
      actionVerb: CREATE
      description: >
        Formats subject, role, meeting time, and gathered context into a
        MeetBrief-style one-pager (snapshot, discussion points, open questions,
        sources).
      inputs:
        subject:
          title: Subject
          type: string
          required: true
          description: Company, person, or meeting topic.
        role:
          title: Your seat
          type: string
          required: false
          description: One of supplier, investor, partner, influencer, teammate.
        meetingLabel:
          title: Meeting label
          type: string
          required: false
          description: When / what the meeting is (free text).
        objective:
          title: Objective
          type: string
          required: false
          description: What you want from the meeting.
        contextJson:
          title: Context JSON
          type: string
          required: false
          description: Optional JSON string of prior gather-* action results.

  function:
    - key: resolver
      handler: index.handler
    - key: gatherIssueContext
      handler: actions.gatherIssueContext
    - key: gatherPageContext
      handler: actions.gatherPageContext
    - key: assembleBrief
      handler: actions.assembleBrief

resources:
  - key: main
    path: src/frontend/index.jsx

app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/fdcd4f89-f906-42ff-8922-f2748aec5ebe
  compatibility:
    jira:
      required: true
    confluence:
      required: false

permissions:
  scopes:
    - read:jira-work
    # write:jira-work is used only by the "Post open questions" button (one comment, as the user).
    - write:jira-work
    # storage:app keeps the last 5 brief summaries per work item in Forge KVS.
    - storage:app
    - read:confluence-content.summary
    - read:confluence-content.permission
    - search:confluence
    # Teamwork Graph scopes removed for first deploy (restricted until allowlisted):
    # - read:graph:jira
    # - read:graph:confluence
